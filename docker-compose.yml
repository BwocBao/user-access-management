version: "3.9"

# Anchor cho DB environment
x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

# Anchor cho service chung
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}

services:

  postgres-db:
    image: postgres:15
    container_name: postgres-db
    #Container crash → restart. Reboot máy → restart. Nhưng nếu stop thủ công → nó nhớ trạng thái stop và không tự chạy lại
    restart: unless-stopped
    environment:
      <<: *database-env
#      POSTGRES_DB: ${AUTH_DB}
    ports:
      - "55432:5432"
    volumes:
      #named volume:map volume postgres_data đã tạo ở câu lệnh dưới cùng vào trong container tại: /var/lib/postgresql/data
      - postgres_data:/var/lib/postgresql/data
      #Bind mount: gắn file init.sql ở máy vào docker ở /docker-entrypoint-initdb.d/init.sql vì thư mục /docker-entrypoint-initdb.d
      #trong postgres nên nó sẽ có cơ chế hoạt động là khi chưa có database nó sẽ chạy init.sql còn nếu có sẽ ko chạy nx
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    #Đợi DB READY rồi mới cho service start.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      #Mỗi 5s test DB coi database sẵn sàng chưa
      interval: 5s
      #Nếu 5s ko trả lời thì fail
      timeout: 5s
      #Fail 5 lần → container = unhealthy. Lúc này các service depends_on database sẽ ko chạy đc
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${AUTH_DB}
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${USER_DB}
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
    name: uam_postgres_data



# start ≠ ready
#Ví dụ thực tế:
#  Docker start container Postgres
#  Postgres cần 3–5 giây để init
#  Trong lúc đó auth-service đã start
#  Spring Boot connect DB
#  ❌ Connection refused
#  👉 Vì DB chưa ready.






