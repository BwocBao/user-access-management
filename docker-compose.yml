#Đầu tiên docker đọc docker-compose và xác định build context
#  1️⃣ Docker đọc .dockerignore
#  2️⃣ Docker loại file khỏi context
#  3️⃣ Docker gửi context sang daemon
#  4️⃣ Dockerfile mới bắt đầu chạy COPY
#Nếu ko dockerignore thì docker sẽ nén toàn bộ project gửi sang daemon rồi lúc này Dockerfile mới bắt đầu
#nhưng chỉ copy rất ít cái(pom với src) nên ko cần nén hết tất cả quăng qua rất tốn CPU và RAM