image: maven:3.9.6-eclipse-temurin-17

services:
  #tương đương docker run postgres:15
  - name: postgres:15
    #Container của postgres sẽ được gọi bằng tên: postgres-db
    alias: postgres-db

variables:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  AUTH_DB: auth_service
  USER_DB: user_service
  SPRING_PROFILES_ACTIVE: ci
  #Chỉ định Maven lưu dependency vào: .m2/repository. Thay vì ~/.m2=> Để cache được.
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: maven-cache
  paths:
    - .m2/repository

stages:
  - build
  - test
  - deploy

# ================= BUILD =================
build-job:
  stage: build
  tags:
    - local
  script:
    - chmod +x mvnw
    - ./mvnw clean install -DskipTests
  artifacts:
    #Lưu file build được để stage sau dùng.
    paths:
      - auth-service/target/*.jar
      - user-service/target/*.jar
    #Sau 1 giờ sẽ xóa.
    expire_in: 1 hour

# ================= TEST =================
test-job:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  tags:
    - local

  services:
    - name: docker:24.0.7-dind
      alias: docker
    - name: postgres:15
      alias: postgres-db

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: docker

  script:
    - chmod +x mvnw
    - ./mvnw test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml
# ================= DEPLOY =================
deploy-job:
  stage: deploy
  image: docker:24
  services:
    - name: docker:dind
      alias: docker
  tags:
    - local
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - build-job
  only:
    - main
    - part-9
  script:
    # Dừng stack cũ (nếu có)
    - docker compose down || true
    # Build lại image + chạy lên
    - docker compose up -d --build


