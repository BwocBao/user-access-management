image: maven:3.9.6-eclipse-temurin-17

services:
  - name: postgres:15
    alias: postgres-db

variables:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: 2014giadinh
  AUTH_DB: auth_service
  USER_DB: user_service
  SPRING_PROFILES_ACTIVE: ci
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APP_NAME: auth-service

cache:
  key: maven-cache
  paths:
    - .m2/repository

stages:
  - test
  - build
  - deploy

test-job:
  stage: test
  tags:
    - local
  before_script:
    - chmod +x mvnw
    - apt-get update && apt-get install -y curl postgresql-client
    - curl -sSL https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh -o wait-for-it.sh
    - chmod +x wait-for-it.sh
    - ./wait-for-it.sh postgres-db:5432 -t 60 -- echo "postgres-db is up"
    - export PGPASSWORD="$POSTGRES_PASSWORD"
    - |
      for DB in "$AUTH_DB" "$USER_DB"; do
        echo "Ensuring database '$DB' exists..."
        psql -h postgres-db -U "$POSTGRES_USER" -tc "SELECT 1 FROM pg_database WHERE datname = '$DB'" | grep -q 1 || \
        psql -h postgres-db -U "$POSTGRES_USER" -c "CREATE DATABASE \"$DB\""
      done
  script:
    - ./mvnw test -pl auth-service -am
    - ./mvnw test -pl user-service -am
  artifacts:
    when: always
    reports:
      junit:
        - auth-service/target/surefire-reports/*.xml
        - user-service/target/surefire-reports/*.xml

build-job:
  stage: build
  tags:
    - local
  script:
    - chmod +x mvnw
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - core/target/*.jar
      - auth-service/target/*.jar
      - user-service/target/*.jar
    expire_in: 1 hour

deploy-job:
  stage: deploy
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  tags:
    - local
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - build-job
  only:
    - main
  script:
    - 'JAR_FILE=$(ls auth-service/target/*.jar | head -n 1)'
    - 'echo "Using jar: $JAR_FILE"'
    - 'docker rm -f "$APP_NAME" || true'
    - |
      docker run -d \
        --name "$APP_NAME" \
        -p 8080:8080 \
        -v "$CI_PROJECT_DIR/$JAR_FILE:/app.jar" \
        mcr.microsoft.com/openjdk/jdk:17-ubuntu \
        java -jar /app.jar